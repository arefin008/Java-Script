<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
      crossorigin="anonymous"
    ></script>

    <!-- js  -->
    <script src="js/script.js" defer></script>
  </head>
  <body class="bg-secondary text-white container pt-5">
    <div class="m-5 text-center">
      <h2 class="h4 mb-4">Get Univercities By Country</h2>
      <input
        type="text"
        id="country"
        placeholder="Enter Country Name"
        class="form-control w-50 mx-auto"
      />
      <!-- onchange="fetchUnivercities()" -->
      <button class="btn btn-success mt-3" onclick="fetchUnivercities()">
        Get Univercities
      </button>

      <h3 id="universityCount" class="h5 mt-3"></h3>
      <ol id="universityList" class="my-2 list-group"></ol>
    </div>
  </body>
</html>
